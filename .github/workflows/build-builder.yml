name: Build Desktop Builders
on:
  workflow_dispatch:
  push:
    # main of the main repository builds the stable channel (tools/select_channel.py).
    branches: [main, android-ui-and-update-loader, portable-builder-and-resources, "sync-upstream-*"]
    paths: ['builder/**', 'android-setup/**', '.github/workflows/build-builder.yml', 'hook.ts', 'runtime/**', 'tools/select_channel.py']
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          python -m pip install -r builder/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci
      - name: Select update channel
        run: python tools/select_channel.py
      - name: Prepare tools and emoji resources
        run: |
          python -m builder.bootstrap_tools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/prepare_emojis.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python android-setup/build.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
      - name: Validate
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python android-setup/test_native.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python android-setup/test_prelaunch.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m tests.integration_builder_apk
      - name: Create bundled Java runtime
        shell: pwsh
        run: |
          & "$env:JAVA_HOME/bin/jlink.exe" --add-modules java.base,java.desktop,java.logging,java.xml,java.naming,jdk.crypto.ec,jdk.unsupported,jdk.zipfs,jdk.charsets,jdk.localedata --strip-debug --no-header-files --no-man-pages --output vendor/jre
      - name: Package Windows EXE
        run: python -m builder.package_windows
      - name: Smoke-test frozen Windows EXE
        shell: pwsh
        run: |
          $report = Join-Path $PWD 'dist/self-test.json'
          $process = Start-Process -FilePath dist/TESL-Reborn-Builder.exe -ArgumentList '--self-test', "`"$report`"" -WorkingDirectory $PWD.Path -Wait -PassThru
          if ($process.ExitCode -ne 0) { Get-Content dist/self-test.json; throw 'Frozen EXE smoke test failed' }
          Get-Content dist/self-test.json
      - uses: actions/upload-artifact@v4
        with:
          name: TESL-Reborn-Builder-Windows
          path: |
            dist/TESL-Reborn-Builder.exe
            dist/self-test.json
            dist/android-49-50-check-ru.md
            dist/builder-ru.md
            dist/THIRD_PARTY_BUILDER.md
            dist/third-party-notices
          retention-days: 14

  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk tk8.6 xvfb xauth libgl1
          python -m pip install -r builder/requirements.txt
          npm ci
      - name: Select update channel
        run: python tools/select_channel.py
      - name: Prepare and validate Linux tools
        run: |
          python -m builder.bootstrap_tools
          python tools/prepare_emojis.py
          python android-setup/build.py
          npm run build
          npm test
          python android-setup/test_native.py
          python android-setup/test_prelaunch.py
          python -m tests.integration_builder_apk
      - name: Bundle Java and package Linux app
        run: |
          "$JAVA_HOME/bin/jlink" --add-modules java.base,java.desktop,java.logging,java.xml,java.naming,jdk.crypto.ec,jdk.unsupported,jdk.zipfs,jdk.charsets,jdk.localedata --strip-debug --no-header-files --no-man-pages --output vendor/jre
          python -m builder.package_windows
          xvfb-run -a dist/TESL-Reborn-Builder --self-test dist/self-test.json
          cat dist/self-test.json
      - uses: actions/upload-artifact@v4
        with:
          name: TESL-Reborn-Builder-Linux-x86_64
          path: |
            dist/TESL-Reborn-Builder-Linux-x86_64.tar.gz
            dist/self-test.json
          retention-days: 14
