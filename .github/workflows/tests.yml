name: Hook Tests
on:
  push:
    branches: [android-ui-and-update-loader, portable-builder-and-resources, "sync-upstream-*"]
    paths:
      - 'hook.ts'
      - 'tests/**'
      - 'runtime/**'
      - 'tools/**'
      - 'builder/**'
      - 'build_single_apk.py'
      - 'resources/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'hook.ts'
      - 'tests/**'
      - 'runtime/**'
      - 'tools/**'
      - 'builder/**'
      - 'build_single_apk.py'
      - 'resources/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/tests.yml'
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # The builder needs Python 3.11+ (hashlib.file_digest) and UnityPy; the
      # distribution python3 of ubuntu-22.04 is 3.10. Use the builder's own
      # Python and requirements. builder.gui imports tkinter, which needs the
      # system Tk libraries.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Tk
        run: |
          sudo apt-get update
          sudo apt-get install -y tk-dev
      - name: Install dependencies
        run: |
          npm ci
          python -m pip install -r builder/requirements.txt
      - name: Run tests
        run: npm test
