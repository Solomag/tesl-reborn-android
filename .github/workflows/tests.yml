name: Hook Tests
on:
  push:
    branches: [main, android-ui-and-update-loader, portable-builder-and-resources, "sync-upstream-*"]
    paths:
      - 'hook/**'
      - 'hook.js'
      - 'updates/**'
      - 'android-setup/**'
      - 'tests/**'
      - 'runtime/**'
      - 'tools/**'
      - 'builder/**'
      - 'build_single_apk.py'
      - 'resources/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'hook/**'
      - 'hook.js'
      - 'updates/**'
      - 'android-setup/**'
      - 'tests/**'
      - 'runtime/**'
      - 'tools/**'
      - 'builder/**'
      - 'build_single_apk.py'
      - 'resources/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/tests.yml'
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      # The builder needs Python 3.11+ (hashlib.file_digest) and UnityPy; the
      # distribution python3 of ubuntu-22.04 is 3.10. Use the builder's own
      # Python and requirements. builder.gui imports tkinter, which needs the
      # system Tk libraries.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: builder/requirements.txt
      # The setup screens (Java) are compiled and tested on pull requests too,
      # not only when the Builder is built after a push.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: vendor/_downloads
          key: tools-${{ runner.os }}-${{ hashFiles('builder/bootstrap_tools.py', 'builder/*.json') }}
          restore-keys: tools-${{ runner.os }}-
      - name: Install Tk
        run: |
          # Ubuntu's mirrors fail now and then (exit 100): a broken extra
          # source must not stop the update, and the install is retried.
          for attempt in 1 2 3; do
            sudo apt-get update -o Acquire::Retries=3 || echo "apt-get update reported errors"
            if sudo apt-get install -y -o Acquire::Retries=3 --fix-missing tk-dev; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 20
          done
      - name: Install dependencies
        run: |
          npm ci
          python -m pip install -r builder/requirements.txt
      - name: Run tests
        run: npm test
      # The committed loader and core must be what hook/ builds to: a stale
      # one would publish a different SHA than the APK embeds.
      - name: Setup screens (Java)
        run: |
          python -m builder.bootstrap_tools
          python android-setup/build.py
          python android-setup/test_native.py
          python android-setup/test_prelaunch.py
      - name: Generated files are current
        run: |
          npm run build
          git diff --exit-code -- hook.js runtime/
